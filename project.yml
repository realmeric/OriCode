name: OriCode
options:
  bundleIdPrefix: com.realmeric
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # The Debug build's name and bundle id, and the folder the engine is staged in, which make
    # passes on: OriCode Molten in ~/Library/Developer/OriCode.noindex unless a branch's builds
    # need their own, so two branches built at once never share a store or an engine.
    ORICODE_DEBUG_NAME: OriCode Molten
    ORICODE_DEBUG_ID: com.realmeric.oricode.molten
    ORICODE_BUILD: $(HOME)/Library/Developer/OriCode.noindex
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  # The CommonMark parser MarkdownUI is built on, which a reply's blocks are found with (Reply.swift).
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark
    from: 0.4.0
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.3.0
  # Needs Xcode's Metal Toolchain (xcodebuild -downloadComponent MetalToolchain) for its shader,
  # and its build-info plugin is why the Makefile's xcodebuild lines skip plugin validation.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  # Updates, from the appcast on GitHub; OriCode draws its own quiet UI for it (Updates.swift).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  # What the Mac and the phone share (KANBAN-phone.md): records, sealing, pairing, commands.
  Link:
    path: Link
# What OriCode and its measuring build share: the app's sources, packages, Info.plist and engine.
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MarkdownUI
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: Highlightr
      - package: SwiftTerm
      - package: Sparkle
      - package: Link
    info:
      path: App/Info.plist
      properties:
        OriCodeSource: $(SRCROOT)
        # Where the build keeps its store, actions, review marks and logs, by its name, so OriCode
        # Molten never opens OriCode's.
        OriCodeFolder: $(PRODUCT_NAME)
        # From the build settings, so make app and make release can number a build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Updates (Updates.swift): the appcast on main, checked daily without asking, and the
        # public half of the EdDSA key whose private half signs each release in Meriç's keychain.
        SUFeedURL: $(ORICODE_FEED_URL)
        SUPublicEDKey: erFeKNgb/Vqz71ZHr55xPBBr04BvFD0opdrIR1LkJt4=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realmeric.oricode
        PRODUCT_NAME: OriCode
        # One module whatever the product is called, so the tests' @testable import holds.
        PRODUCT_MODULE_NAME: OriCode
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "1"
        ORICODE_FEED_URL: https://raw.githubusercontent.com/realmeric/OriCode/main/appcast.xml
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OriCode
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The brief has no accent colour; this keeps the system's blue out of tabs, default buttons and selection.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Your coding agent reads and edits the projects you add, and some of them live in Documents.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Your coding agent reads and edits the projects you add, and some of them live on the Desktop.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Your coding agent reads and edits the projects you add, and some of them live in Downloads.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
      configs:
        # The build you work on is an app of its own, OriCode Molten, beside the OriCode you
        # work in: its own bundle id, folders and icon, so running it quits only it.
        # Signed for development by Xcode, with a profile that lets it reach CloudKit's
        # Development environment, which debug phone builds talk to (KANBAN-phone.md).
        Debug:
          PRODUCT_NAME: $(ORICODE_DEBUG_NAME)
          PRODUCT_BUNDLE_IDENTIFIER: $(ORICODE_DEBUG_ID)
          INFOPLIST_KEY_CFBundleDisplayName: $(ORICODE_DEBUG_NAME)
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: 422F85XX9Z
          CODE_SIGN_ENTITLEMENTS: App/OriCode.entitlements
          ORICODE_APS_ENVIRONMENT: development
          ORICODE_CLOUDKIT_ENVIRONMENT: Development
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMolten
          # Molten has no feed, so it never updates itself into OriCode.
          ORICODE_FEED_URL: ""
        # Apple silicon only, and stripped as an archive would be: a quarter the size of the
        # universal binary with its symbols. The dSYM beside the app keeps them for crashes.
        Release:
          ARCHS: arm64
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
    preBuildScripts:
      - name: Engine
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          make -C "$SRCROOT" engine BUILD="$ORICODE_BUILD"
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle engine
        script: |
          if [ -d "$ORICODE_BUILD/engine" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            rsync -a --delete --exclude .stamp "$ORICODE_BUILD/engine/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/engine/"
          fi
        basedOnDependencyAnalysis: false
targets:
  OriCode:
    templates: [App]
    # Release reaches CloudKit's Production environment, which TestFlight and App Store phone
    # builds talk to. It's archived signed for development, and scripts/export.sh signs it again
    # with Developer ID and the Developer ID profile that allows these entitlements.
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: 422F85XX9Z
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: App/OriCode.entitlements
          ORICODE_APS_ENVIRONMENT: production
          ORICODE_CLOUDKIT_ENVIRONMENT: Production
  # OriCode with the bench in it (Perf/), for make perf: an app of its own beside the other two,
  # with its own bundle id, folders and store. PERF is what compiles its two hooks into the
  # app's sources; no other target sets it, so OriCode never carries the bench.
  OriCode Perf:
    templates: [App]
    sources:
      - path: Perf
        excludes: ["*.json"]
    settings:
      base:
        PRODUCT_NAME: OriCode Perf
        PRODUCT_BUNDLE_IDENTIFIER: com.realmeric.oricode.perf
        INFOPLIST_KEY_CFBundleDisplayName: OriCode Perf
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERF
        # No feed, so it never updates itself into OriCode.
        ORICODE_FEED_URL: ""
      configs:
        Debug:
          PRODUCT_NAME: OriCode Perf
          PRODUCT_BUNDLE_IDENTIFIER: com.realmeric.oricode.perf
          INFOPLIST_KEY_CFBundleDisplayName: OriCode Perf
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OriCodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: OriCode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        # Tests run in Debug, which builds OriCode Molten.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(ORICODE_DEBUG_NAME).app/Contents/MacOS/$(ORICODE_DEBUG_NAME)
  # OriCode on the phone (KANBAN-phone.md): a window onto the OriCode on the Mac, meeting it in
  # CloudKit. Debug talks to CloudKit's Development environment, which Bridge does, and Release
  # to Production, which the installed OriCode does.
  OriCode Phone:
    type: application
    platform: iOS
    sources:
      - Phone
    dependencies:
      - package: Link
      - target: OriCode Notify
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: OriCode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSCameraUsageDescription: To scan the pairing code on your Mac.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: OriCodePhone
        PRODUCT_BUNDLE_IDENTIFIER: com.realmeric.oricode.phone
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 422F85XX9Z
        CODE_SIGN_ENTITLEMENTS: Phone/OriCodePhone.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
      configs:
        Debug:
          ORICODE_CLOUDKIT_ENVIRONMENT: Development
        Release:
          ORICODE_CLOUDKIT_ENVIRONMENT: Production
  # Opens a notification's sealed Nudge and writes its words on the phone.
  OriCode Notify:
    type: app-extension
    platform: iOS
    sources:
      - PhoneNotify
    dependencies:
      - package: Link
    info:
      path: PhoneNotify/Info.plist
      properties:
        CFBundleDisplayName: OriCode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_NAME: OriCodeNotify
        PRODUCT_BUNDLE_IDENTIFIER: com.realmeric.oricode.phone.notify
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 422F85XX9Z
        CODE_SIGN_ENTITLEMENTS: PhoneNotify/OriCodeNotify.entitlements
      configs:
        Debug:
          ORICODE_CLOUDKIT_ENVIRONMENT: Development
        Release:
          ORICODE_CLOUDKIT_ENVIRONMENT: Production
schemes:
  OriCode Phone:
    build:
      targets:
        OriCode Phone: all
    run:
      config: Debug
  OriCode:
    build:
      targets:
        OriCode: all
        OriCodeTests: [test]
    test:
      targets:
        - OriCodeTests
  # make perf's build, kept out of OriCode's scheme so make run, make test and make app never build it.
  OriCode Perf:
    build:
      targets:
        OriCode Perf: all
    run:
      config: Release
