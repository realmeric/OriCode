name: OriCode
options:
  bundleIdPrefix: com.realmeric
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.3.0
targets:
  OriCode:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MarkdownUI
      - package: Highlightr
    info:
      path: App/Info.plist
      properties:
        OriCodeSource: $(SRCROOT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realmeric.oricode
        PRODUCT_NAME: OriCode
        MARKETING_VERSION: "0.0.81"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OriCode
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The brief has no accent colour; this keeps the system's blue out of tabs, default buttons and selection.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Claude reads and edits the projects you add, and some of them live in Documents.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Claude reads and edits the projects you add, and some of them live on the Desktop.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Claude reads and edits the projects you add, and some of them live in Downloads.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
      configs:
        # Apple silicon only, and stripped as an archive would be: a quarter the size of the
        # universal binary with its symbols. The dSYM beside the app keeps them for crashes.
        Release:
          ARCHS: arm64
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
    preBuildScripts:
      - name: Engine
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          make -C "$SRCROOT" engine
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle engine
        script: |
          if [ -d "$HOME/Library/Developer/OriCode/engine" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            rsync -a --delete --exclude .stamp "$HOME/Library/Developer/OriCode/engine/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/engine/"
          fi
        basedOnDependencyAnalysis: false
  OriCodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: OriCode
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OriCode.app/Contents/MacOS/OriCode
schemes:
  OriCode:
    build:
      targets:
        OriCode: all
        OriCodeTests: [test]
    test:
      targets:
        - OriCodeTests
